<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day19 - Local Storage Demo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <h2>Local Storage Demo</h2>
      <p>Save your name and theme. They stay even after a refresh.</p>

      <label for="name">Your Name</label>
      <div class="storeName">
        <input type="text" id="name" placeholder="Enter your name" />
        <button class="save" type="button">Save</button>
      </div>

      <button class="theme" type="button">Switch to light theme</button>

      <div class="status" aria-live="polite">Loading your saved data...</div>
      <textarea id="screen" readonly></textarea>
    </div>

    <script src="script.js"></script>
  </body>
</html>
